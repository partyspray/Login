<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vindora | تسجيل الموردين</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header><h1>Vindora</h1><span>تسجيل مورد جديد</span><p>انضم لشبكة موردين Vindora ووسّع مبيعات منتجاتك من خلال فريق التسويق بالعمولة.</p></header><form id="f"><h2>بيانات المورد</h2><label>الاسم بالكامل *</label><input name="الاسم" required><label>اسم الشركة أو النشاط *</label><input name="النشاط" required><label>رقم الواتساب *</label><input name="الواتساب" type="tel" pattern="01[0125][0-9]{8}" placeholder="01xxxxxxxxx" required><label>المحافظة *</label><select name="المحافظة" required><option value="">اختار المحافظة</option></select><div class="divider"></div><h2>تفاصيل المنتجات</h2><label>نوع المورد *</label><div id="types"></div><label>فئات المنتجات *</label><div id="cats"></div><div class="divider"></div><h2>الشحن والمرتجعات</h2><label>مين المسؤول عن الشحن؟ *</label><div id="ship"></div><label>هل تقبل المرتجعات؟ *</label><div id="returns"></div><label>ملاحظات إضافية</label><textarea name="ملاحظات" rows="3" placeholder="أسعار الجملة، الحد الأدنى للطلب، رابط الكتالوج..."></textarea><label class="choice"><input type="checkbox" required> أوافق على مشاركة بياناتي مع فريق Vindora للتواصل بشأن التعاون.</label><button>إرسال الطلب عبر واتساب</button><p class="hint">سيفتح واتساب برسالة جاهزة. اضغط إرسال داخل واتساب لإتمام التسجيل.</p></form></div><script src="shared.js"></script><script>
fillGov();choices('types','نوع المورد',['مصنع','تاجر جملة','مستورد','صاحب براند','موزع']);choices('cats','المنتجات',['ملابس وأزياء','إكسسوارات ومستلزمات موبايل','أدوات منزلية ومطبخ','تجميل وعناية شخصية','إلكترونيات','منتجات متنوعة'],true);choices('ship','الشحن',['المورد','Vindora','حسب الاتفاق']);choices('returns','المرتجعات',['نعم','لا','حسب حالة المنتج']);document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(!f.querySelector('[name="المنتجات"]:checked'))return alert('اختار فئة منتجات واحدة على الأقل');sendWhatsApp(f,'طلب تسجيل مورد جديد - Vindora')});
</script></body></html>
