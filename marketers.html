<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vindora | تسجيل المسوقين</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header><h1>Vindora</h1><span>تسجيل مسوق جديد</span><p>انضم لفريق Vindora وابدأ التسويق بالعمولة من غير ما تشتري منتجات أو تخزن بضاعة.</p></header><form id="f"><h2>البيانات الشخصية</h2><label>الاسم بالكامل *</label><input name="الاسم" required placeholder="اكتب اسمك بالكامل"><label>رقم الواتساب *</label><input name="الواتساب" type="tel" pattern="01[0125][0-9]{8}" required placeholder="01xxxxxxxxx"><label>المحافظة *</label><select name="المحافظة" required><option value="">اختار محافظتك</option></select><label>السن (اختياري)</label><input name="السن" type="number" min="1" max="110"><div class="divider"></div><h2>الخبرة في التسويق</h2><div id="experience"></div><div class="divider"></div><h2>هتسوق على إيه؟</h2><p class="hint">تقدر تختار أكتر من منصة.</p><div id="platforms"></div><label>منصة أخرى (اختياري)</label><input name="منصة أخرى"><label class="choice"><input type="checkbox" required> أوافق على إرسال بياناتي لفريق Vindora للتواصل بخصوص الانضمام.</label><button>إرسال البيانات عبر واتساب</button><p class="hint">سيفتح واتساب برسالة جاهزة. اضغط إرسال داخل واتساب لإتمام التسجيل.</p></form></div><script src="shared.js"></script><script>
fillGov();choices('experience','الخبرة',['مبتدئ ومحتاج أتعلم','عندي خبرة بسيطة','مسوق وعندي خبرة في المبيعات','عندي فريق تسويق']);choices('platforms','منصات التسويق',['فيسبوك','واتساب','تيك توك','إنستجرام','تيليجرام','البيع المباشر'],true);document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(!f.querySelector('[name="منصات التسويق"]:checked')&&!f.elements['منصة أخرى'].value.trim())return alert('اختار منصة واحدة على الأقل');sendWhatsApp(f,'طلب انضمام مسوق جديد - Vindora')});
</script></body></html>
